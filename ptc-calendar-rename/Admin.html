<!-- PTC ADMIN - served by WebApp.gs doGet(). -->
<style>
  :root {
    --navy:    #1e3a8a;
    --blue:    #2563eb;
    --pale:    #dbeafe;
    --ink:     #0f172a;
    --body:    #475569;
    --muted:   #94a3b8;
    --line:    #e2e8f0;
    --bg:      #f1f5f9;
    --card:    #ffffff;
    --green:   #16a34a;
    --amber:   #d97706;
    --red:     #dc2626;
    --red-bg:  #fee2e2;
    --amber-bg:#fef3c7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Arial, sans-serif;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 18px 64px;
  }

  /* ---------- header ---------- */

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: 21px;
    letter-spacing: -0.01em;
    color: var(--navy);
  }

  .sub { color: var(--body); font-size: 13px; margin-top: 3px; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 8px 13px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }

  button:hover:not(:disabled) { border-color: var(--blue); }
  button:disabled { opacity: .5; cursor: default; }

  button.primary {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }

  button.primary:hover:not(:disabled) { background: #1b3382; }

  button.danger {
    background: #fff;
    border-color: #fecaca;
    color: var(--red);
    padding: 5px 11px;
    font-size: 13px;
  }

  button.danger:hover:not(:disabled) {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  /* ---------- progress ---------- */

  #progress {
    height: 4px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    margin-bottom: 18px;
  }

  #progressBar {
    height: 100%;
    width: 0;
    background: var(--blue);
    transition: width .25s;
  }

  /* ---------- stats ---------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 15px;
  }

  .stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    font-weight: 600;
  }

  .stat .value {
    font-size: 25px;
    font-weight: 600;
    margin-top: 3px;
    letter-spacing: -0.02em;
  }

  .stat .foot { font-size: 12px; color: var(--body); }
  .stat.alert .value { color: var(--red); }

  /* ---------- filters ---------- */

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
  }

  .chip {
    border-radius: 99px;
    padding: 6px 13px;
    font-size: 13px;
    background: var(--card);
    border: 1px solid var(--line);
    cursor: pointer;
  }

  .chip[aria-pressed="true"] {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }

  input[type="search"] {
    font: inherit;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    min-width: 210px;
    flex: 1 1 210px;
    background: var(--card);
  }

  input[type="search"]:focus {
    outline: 2px solid var(--pale);
    border-color: var(--blue);
  }

  /* ---------- class cards ---------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  .card.open {
    grid-column: 1 / -1;
    border-color: var(--blue);
  }

  .card > .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 15px;
    cursor: pointer;
    width: 100%;
    background: none;
    border: 0;
    border-radius: 0;
    text-align: left;
  }

  .card > .head:hover { background: #f8fafc; }

  .name { font-weight: 600; }

  .cal {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 260px;
  }

  .count {
    margin-left: auto;
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .count b { font-size: 16px; }
  .count span { color: var(--muted); font-size: 12px; }

  .bar {
    height: 5px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
    margin: 0 15px 13px;
  }

  .bar > i {
    display: block;
    height: 100%;
    background: var(--blue);
    width: 0;
    transition: width .3s;
  }

  .bar.full > i { background: var(--green); }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    margin-left: 8px;
    vertical-align: 2px;
  }

  .badge.dup   { background: var(--red-bg);   color: #991b1b; }
  .badge.off   { background: var(--amber-bg); color: #92400e; }
  .badge.err   { background: #f1f5f9;         color: var(--body); }
  .badge.load  { background: var(--pale);     color: var(--navy); }

  /* ---------- bookings ---------- */

  .bookings { border-top: 1px solid var(--line); }

  table { width: 100%; border-collapse: collapse; }

  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    padding: 9px 12px;
    background: #f8fafc;
    border-bottom: 1px solid var(--line);
  }

  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  tr.dup td { background: var(--red-bg); }
  tr.off td { background: var(--amber-bg); }

  .time { font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; color: var(--body); }
  .flagtxt { font-size: 12px; color: #991b1b; }

  .free {
    padding: 11px 15px;
    font-size: 12px;
    color: var(--body);
    background: #f8fafc;
    border-top: 1px solid var(--line);
  }

  .free b { color: var(--ink); }

  .empty { padding: 22px 15px; color: var(--muted); }

  /* ---------- modal + toast ---------- */

  dialog {
    border: 0;
    border-radius: 14px;
    padding: 0;
    max-width: 400px;
    width: calc(100% - 32px);
    box-shadow: 0 18px 48px rgba(15, 23, 42, .22);
  }

  dialog::backdrop { background: rgba(15, 23, 42, .45); }

  .modal-body { padding: 20px 22px 8px; }
  .modal-body h2 { margin: 0 0 8px; font-size: 17px; color: var(--navy); }
  .modal-body p { margin: 0 0 12px; color: var(--body); }

  .modal-body dl {
    margin: 0 0 14px;
    display: grid;
    grid-template-columns: 78px 1fr;
    gap: 4px 10px;
    font-size: 13px;
  }

  .modal-body dt { color: var(--muted); }
  .modal-body dd { margin: 0; }

  .check {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    font-size: 13px;
    color: var(--body);
    padding: 10px 12px;
    background: #f8fafc;
    border-radius: 9px;
  }

  .modal-foot {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 22px 20px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 90px);
    background: var(--ink);
    color: #fff;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 13px;
    max-width: 90vw;
    transition: transform .25s;
    z-index: 9;
  }

  #toast.show { transform: translate(-50%, 0); }
  #toast.bad { background: var(--red); }

  @media (max-width: 560px) {
    .cal { max-width: 150px; }
    th.hide, td.hide { display: none; }
  }
</style>

<div class="wrap">

  <header>
    <div>
      <h1>PTC Admin</h1>
      <div class="sub" id="subtitle">Loading classes&hellip;</div>
    </div>

    <div class="actions">
      <button id="btnRefresh" class="primary">Refresh all</button>
      <button id="btnExport">Export to Sheet</button>
    </div>
  </header>

  <div id="progress"><div id="progressBar"></div></div>

  <div class="stats">
    <div class="stat">
      <div class="label">Calendars live</div>
      <div class="value" id="sCal">&mdash;</div>
      <div class="foot" id="sCalFoot">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="label">Slots taken</div>
      <div class="value" id="sBooked">&mdash;</div>
      <div class="foot" id="sBookedFoot">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="label">Slots free</div>
      <div class="value" id="sFree">&mdash;</div>
      <div class="foot" id="sFreeFoot">&nbsp;</div>
    </div>
    <div class="stat" id="sDupCard">
      <div class="label">Duplicates</div>
      <div class="value" id="sDup">&mdash;</div>
      <div class="foot" id="sDupFoot">&nbsp;</div>
    </div>
  </div>

  <div class="filters">
    <button class="chip" data-grade="" aria-pressed="true">All</button>
    <button class="chip" data-grade="P1" aria-pressed="false">P1</button>
    <button class="chip" data-grade="P2" aria-pressed="false">P2</button>
    <button class="chip" data-grade="P3" aria-pressed="false">P3</button>
    <button class="chip" data-grade="P4" aria-pressed="false">P4</button>
    <button class="chip" data-grade="P5" aria-pressed="false">P5</button>
    <button class="chip" data-grade="P6" aria-pressed="false">P6</button>
    <button class="chip" id="dupOnly" aria-pressed="false">
      Duplicates only
    </button>
    <input type="search" id="search"
           placeholder="Search student, parent or email">
  </div>

  <div class="grid" id="grid"></div>
</div>

<dialog id="confirm">
  <form method="dialog">
    <div class="modal-body">
      <h2>Delete this booking?</h2>
      <p>The slot is freed immediately and can be booked again.</p>

      <dl>
        <dt>Class</dt><dd id="cClass"></dd>
        <dt>Time</dt><dd id="cTime"></dd>
        <dt>Student</dt><dd id="cStudent"></dd>
        <dt>Parent</dt><dd id="cParent"></dd>
      </dl>

      <label class="check">
        <input type="checkbox" id="cNotify" checked>
        <span>Email the parent a cancellation from Google Calendar.
              Untick to free the slot silently.</span>
      </label>
    </div>

    <div class="modal-foot">
      <button value="cancel">Cancel</button>
      <button value="delete" class="danger" id="cGo">Delete booking</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script>
  var CLASSES = [];
  var STATE = {};
  var CONFIG = null;
  var grade = "";
  var dupOnly = false;
  var query = "";
  var openClass = null;
  var pending = null;

  var $ = function(id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function call(fn, arg) {
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [fn](arg);
    });
  }

  function toast(msg, bad) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "show" + (bad ? " bad" : "");
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.className = ""; }, 4200);
  }

  // ---------- loading ----------

  function boot() {
    call("webGetClasses")
      .then(function(cfg) {
        CONFIG = cfg;
        CLASSES = cfg.classes;

        $("subtitle").textContent =
          cfg.dateHuman + " · " + cfg.slotMinutes +
          "-minute slots · " + cfg.slotsPerClass +
          " slots per class · " + CLASSES.length + " classes";

        render();
        loadAll();
      })
      .catch(function(e) {
        toast(String(e && e.message || e), true);
      });
  }

  /**
   * Reads the calendars a few at a time so the dashboard fills in
   * as results arrive, instead of one long request for all 60.
   */
  function loadAll() {

    var queue = CLASSES.map(function(c) { return c.className; });
    var total = queue.length;
    var done = 0;
    var CONCURRENCY = 5;

    $("btnRefresh").disabled = true;
    setProgress(0);

    function next() {

      if (!queue.length) {
        return Promise.resolve();
      }

      var name = queue.shift();
      STATE[name] = STATE[name] || {};
      STATE[name].loading = true;

      return call("webGetClass", name)
        .then(function(k) {
          STATE[name] = k;
        })
        .catch(function(e) {
          STATE[name] = {
            className: name,
            status: "ERROR: " + (e && e.message || e),
            slotsTotal: 0,
            booked: 0,
            free: 0,
            duplicates: 0,
            offSlot: 0,
            bookings: [],
            freeTimes: []
          };
        })
        .then(function() {
          done++;
          setProgress(done / total);
          renderStats();
          renderCard(name);
          return next();
        });
    }

    var runners = [];

    for (var i = 0; i < CONCURRENCY; i++) {
      runners.push(next());
    }

    Promise.all(runners).then(function() {
      $("btnRefresh").disabled = false;
      setProgress(1);
      setTimeout(function() { setProgress(0); }, 600);
      renderStats();
    });
  }

  function setProgress(f) {
    $("progressBar").style.width = Math.round(f * 100) + "%";
  }

  // ---------- stats ----------

  function renderStats() {

    var live = 0, scanned = 0, slots = 0, booked = 0,
        free = 0, dup = 0, off = 0;

    CLASSES.forEach(function(c) {

      var k = STATE[c.className];
      if (!k || k.loading || !k.status) return;

      scanned++;
      if (k.status === "OK") live++;

      slots += k.slotsTotal || 0;
      booked += k.booked || 0;
      free += k.free || 0;
      dup += k.duplicates || 0;
      off += k.offSlot || 0;
    });

    $("sCal").textContent = live;
    $("sCalFoot").textContent =
      "of " + CLASSES.length + " class calendars" +
      (scanned < CLASSES.length ? " (" + scanned + " read)" : "");

    $("sBooked").textContent = booked;
    $("sBookedFoot").textContent =
      slots
        ? Math.round((booked / slots) * 100) + "% of " + slots + " slots"
        : " ";

    $("sFree").textContent = free;
    $("sFreeFoot").textContent = "still bookable";

    $("sDup").textContent = dup;
    $("sDupFoot").textContent =
      off ? off + " off-slot event(s) too" : "repeat bookings";

    $("sDupCard").className = "stat" + (dup ? " alert" : "");
  }

  // ---------- cards ----------

  function visibleClasses() {

    return CLASSES.filter(function(c) {

      if (grade && c.className.indexOf(grade) !== 0) {
        return false;
      }

      var k = STATE[c.className];

      if (dupOnly && (!k || !k.duplicates)) {
        return false;
      }

      if (query) {
        if (!k || !k.bookings) return false;

        var hit = k.bookings.some(function(b) {
          return (
            (b.student || "") + " " +
            (b.parent || "") + " " +
            (b.email || "")
          ).toLowerCase().indexOf(query) !== -1;
        });

        if (!hit && c.className.toLowerCase().indexOf(query) === -1) {
          return false;
        }
      }

      return true;
    });
  }

  function render() {

    var grid = $("grid");
    var list = visibleClasses();

    grid.innerHTML = "";

    if (!list.length) {
      grid.innerHTML =
        '<div class="card empty">No class matches this filter.</div>';
      return;
    }

    list.forEach(function(c) {
      var el = document.createElement("div");
      el.className = "card";
      el.id = "card-" + cssId(c.className);
      grid.appendChild(el);
      paintCard(el, c.className);
    });
  }

  function cssId(name) {
    return name.replace(/[^A-Za-z0-9]/g, "_");
  }

  function renderCard(name) {

    var el = $("card-" + cssId(name));

    if (!el) {
      render();
      return;
    }

    paintCard(el, name);
  }

  function paintCard(el, name) {

    var k = STATE[name];
    var isOpen = openClass === name;

    el.className = "card" + (isOpen ? " open" : "");

    if (!k || !k.status) {
      el.innerHTML =
        '<button class="head"><div><div class="name">' +
        esc(name) +
        '</div><div class="cal">reading calendar…</div></div>' +
        '<div class="count"><span class="badge load">wait</span></div>' +
        '</button>';
      return;
    }

    var pct = k.slotsTotal
      ? Math.round((k.booked / k.slotsTotal) * 100)
      : 0;

    var badges = "";

    if (k.duplicates) {
      badges += '<span class="badge dup">' + k.duplicates +
                ' duplicate' + (k.duplicates > 1 ? 's' : '') + '</span>';
    }

    if (k.offSlot) {
      badges += '<span class="badge off">' + k.offSlot +
                ' off-slot</span>';
    }

    if (k.status !== "OK") {
      badges += '<span class="badge err">' + esc(k.status) + '</span>';
    }

    var html =
      '<button class="head" data-open="' + esc(name) + '">' +
        '<div>' +
          '<div class="name">' + esc(name) + badges + '</div>' +
          '<div class="cal">' + esc(k.calendarName || "—") + '</div>' +
        '</div>' +
        '<div class="count">' +
          '<b>' + k.booked + '</b><span>/' + k.slotsTotal + '</span><br>' +
          '<span>' + pct + '% full</span>' +
        '</div>' +
      '</button>' +
      '<div class="bar' + (k.free === 0 && k.slotsTotal ? ' full' : '') +
        '"><i style="width:' + pct + '%"></i></div>';

    if (isOpen) {
      html += bookingsHtml(k);
    }

    el.innerHTML = html;

    var head = el.querySelector(".head");

    if (head) {
      head.addEventListener("click", function() {
        openClass = (openClass === name) ? null : name;
        render();
      });
    }

    el.querySelectorAll("[data-del]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        askDelete(name, btn.getAttribute("data-del"));
      });
    });
  }

  function bookingsHtml(k) {

    if (!k.bookings.length) {
      return '<div class="bookings"><div class="empty">' +
             'No bookings yet. All ' + k.slotsTotal +
             ' slots are free.</div></div>';
    }

    var rows = k.bookings.map(function(b) {

      var cls =
        b.flag.indexOf("DUPLICATE") === 0
          ? "dup"
          : (b.flag === "OFF-SLOT" ? "off" : "");

      return (
        '<tr class="' + cls + '">' +
          '<td class="time">' + esc(b.time) + '</td>' +
          '<td>' + esc(b.student || "—") +
            (b.flag
              ? '<div class="flagtxt">' + esc(b.flag) + '</div>'
              : '') +
          '</td>' +
          '<td>' + esc(b.parent || "—") +
            '<div class="small">' + esc(b.email || "") + '</div>' +
          '</td>' +
          '<td class="hide small">' + esc(b.phone || "—") + '</td>' +
          '<td class="hide small">' + esc(b.created) + '</td>' +
          '<td style="text-align:right">' +
            '<button class="danger" data-del="' + esc(b.eventId) +
            '">Delete</button>' +
          '</td>' +
        '</tr>'
      );
    }).join("");

    var free = k.freeTimes.length
      ? '<div class="free"><b>' + k.freeTimes.length +
        ' free:</b> ' + k.freeTimes.join(" · ") + '</div>'
      : '<div class="free"><b>Fully booked.</b></div>';

    return (
      '<div class="bookings"><table>' +
        '<tr>' +
          '<th>Time</th><th>Student</th><th>Parent</th>' +
          '<th class="hide">Phone</th><th class="hide">Booked</th>' +
          '<th></th>' +
        '</tr>' + rows +
      '</table>' + free + '</div>'
    );
  }

  // ---------- deleting ----------

  function askDelete(className, eventId) {

    var k = STATE[className];

    var b = k.bookings.filter(function(x) {
      return x.eventId === eventId;
    })[0];

    if (!b) return;

    pending = {
      className: className,
      calendarId: k.calendarId,
      eventId: b.eventId,
      time: b.time,
      student: b.student
    };

    $("cClass").textContent = className;
    $("cTime").textContent = b.time;
    $("cStudent").textContent = b.student || "—";
    $("cParent").textContent =
      (b.parent || "—") + (b.email ? " (" + b.email + ")" : "");

    $("confirm").showModal();
  }

  $("confirm").addEventListener("close", function() {

    if ($("confirm").returnValue !== "delete" || !pending) {
      pending = null;
      return;
    }

    var req = pending;
    req.notify = $("cNotify").checked;
    pending = null;

    toast("Deleting…");

    call("webDeleteBooking", req)
      .then(function(res) {
        STATE[req.className] = res.klass;
        renderStats();
        renderCard(req.className);
        toast(res.message, !res.ok);
      })
      .catch(function(e) {
        toast(String(e && e.message || e), true);
      });
  });

  // ---------- controls ----------

  document.querySelectorAll(".chip[data-grade]").forEach(function(chip) {
    chip.addEventListener("click", function() {

      grade = chip.getAttribute("data-grade");

      document.querySelectorAll(".chip[data-grade]").forEach(function(c) {
        c.setAttribute("aria-pressed", String(c === chip));
      });

      render();
    });
  });

  $("dupOnly").addEventListener("click", function() {
    dupOnly = !dupOnly;
    $("dupOnly").setAttribute("aria-pressed", String(dupOnly));
    render();
  });

  $("search").addEventListener("input", function(e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  $("btnRefresh").addEventListener("click", function() {
    STATE = {};
    render();
    loadAll();
  });

  $("btnExport").addEventListener("click", function() {

    $("btnExport").disabled = true;
    toast("Writing the dashboard and booking sheets…");

    call("webExportToSheet")
      .then(function(res) {
        $("btnExport").disabled = false;
        toast("Sheet updated. Opening…");
        window.open(res.url, "_blank");
      })
      .catch(function(e) {
        $("btnExport").disabled = false;
        toast(String(e && e.message || e), true);
      });
  });

  boot();
</script>
